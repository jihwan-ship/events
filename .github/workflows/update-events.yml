name: Update events

on:
  # 저장소 맨 위 schedule 폴더에 엑셀을 올리면 자동 실행
  push:
    paths:
      - "schedule/*.xls"
  # Actions 탭에서 수동 실행도 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas xlrd

      - name: Update events
        working-directory: Vimeo-Expoportal
        run: |
          XLS=$(ls ../schedule/Coex_Schedule_*.xls | sort | tail -1)
          echo "사용할 엑셀: $XLS"
          python update_events.py "$XLS"

      - name: Commit changes
        run: |
          rm -f Vimeo-Expoportal/events/index.json.bak
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Vimeo-Expoportal/events
          git diff --cached --quiet || (git commit -m "행사 목록 자동 갱신" && git push)
